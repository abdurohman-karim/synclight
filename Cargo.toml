[package]
name = "synclight-rs"
version = "0.5.0"
edition = "2021"
description = "Lightweight screen-sync (ambilight) driver for Robobloq SyncLight LED strips"

[lib]
name = "synclight"
path = "src/lib.rs"

# Console tool for diagnostics: --info, --test, --dry-run.
[[bin]]
name = "synclight-rs"
path = "src/main.rs"

# Background tray application (no console window); `--ui` opens the settings window.
[[bin]]
name = "synclight-tray"
path = "src/tray.rs"

[dependencies]
anyhow = "1"
ctrlc = "3"
# Pure-Rust Windows HID backend: no C code to compile.
hidapi = { version = "2.6", default-features = false, features = ["windows-native"] }
windows-registry = "0.5"
# Settings window (separate process, only alive while the window is open).
eframe = { version = "0.32", default-features = false, features = ["glow", "default_fonts"] }

[dependencies.windows]
version = "0.61"
features = [
    "Win32_Foundation",
    "Win32_Graphics_Direct3D",
    "Win32_Graphics_Direct3D11",
    "Win32_Graphics_Dxgi",
    "Win32_Graphics_Dxgi_Common",
    "Win32_Graphics_Gdi",
    "Win32_Security",
    "Win32_System_Diagnostics_ToolHelp",
    "Win32_System_LibraryLoader",
    "Win32_System_Memory",
    "Win32_System_SystemInformation",
    "Win32_System_Threading",
    "Win32_UI_HiDpi",
    "Win32_UI_Shell",
    "Win32_UI_WindowsAndMessaging",
]

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
panic = "abort"
strip = true
